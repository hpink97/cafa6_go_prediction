[project]
name = "cafa6"
version = "0.1.0"
description = "Protein GO-term function prediction for the CAFA6 Kaggle challenge: ESM-2, handcrafted, taxonomy and promoter features feeding a multi-label neural network."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adjusttext>=1.4.0",
    "biopython>=1.88",
    "datamapplot>=0.2.2",
    "fair-esm>=2.0.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "requests>=2.32.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "torch>=2.14.0",
    "transformers>=4.46.0,<5.0",
    "umap-learn>=0.5.12",
    "xgboost>=3.4.1",
]

[project.scripts]
cafa6-embeddings = "feature_engineering.sequence.embeddings:main"
cafa6-features = "feature_engineering.sequence.protein_features:main"
cafa6-taxonomy-features = "feature_engineering.sequence.taxonomy:main"
cafa6-extract-promoters = "feature_engineering.promoters.extract_promoters:main"
cafa6-build-promoter-reference = "feature_engineering.promoters.build_reference:main"
cafa6-build-and-extract-promoters = "feature_engineering.promoters.build_and_extract:main"
cafa6-rescue-promoters = "feature_engineering.promoters.alignment_rescue:main"
cafa6-embed-promoters = "feature_engineering.promoters.embed_promoters:main"
cafa6-train-go-models = "modeling.gbdt.train:main"
cafa6-train-multilabel-nn = "modeling.nn.train:main"
cafa6-predict-multilabel-nn = "modeling.nn.predict:main"
cafa6-evaluate = "modeling.evaluation.official:main"
cafa6-ablation = "modeling.experiments.ablation:main"
cafa6-hparam-search = "modeling.experiments.hparam_search:main"
cafa6-explain = "modeling.explain.attribution:main"
cafa6-repair-metadata = "scripts.repair_embedding_metadata:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feature_engineering", "src/modeling", "scripts"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
